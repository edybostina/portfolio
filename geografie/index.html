<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Atlas Europa · Bac Geografie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --parchment:#f2e9d3;
  --parchment-dk:#e6d9b8;
  --land:#ece0bf;
  --land-hover:#d8c99a;
  --land-sel:#c9dcb8;
  --ink:#22301f;
  --teal:#2c5c55;
  --brick:#a84a26;
  --gold:#b8912f;
  --line: rgba(34,48,31,0.35);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(184,145,47,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(44,92,85,0.12), transparent 45%),
    var(--parchment);
  color:var(--ink);
  font-family:'EB Garamond', serif;
  padding:24px 16px 60px;
}
h1,h2,h3,.disp{font-family:'Playfair Display', serif;}
.wrap{max-width:1000px; margin:0 auto;}
header{text-align:center; margin-bottom:18px; position:relative;}
header .compass{
  position:absolute; top:-6px; right:0; width:52px; height:52px;
  border:2px solid var(--brick); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  animation: spin 18s linear infinite;
  opacity:0.75;
}
header .compass:before{content:"✦"; color:var(--brick); font-size:22px;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
header .eyebrow{
  font-family:'IBM Plex Mono', monospace; letter-spacing:.18em; text-transform:uppercase;
  font-size:11px; color:var(--teal); margin-bottom:6px;
}
h1{font-size:2.1rem; margin:0 0 4px; color:var(--ink);}
header p{margin:0; color:#4a5744; font-size:.95rem;}

.tabs{display:flex; gap:10px; justify-content:center; margin:22px 0;}
.tab-btn{
  font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:transparent; border:1.5px solid var(--ink); color:var(--ink);
  padding:9px 18px; border-radius:2px; cursor:pointer; transition:.15s;
}
.tab-btn.active{background:var(--teal); border-color:var(--teal); color:var(--parchment);}
.tab-btn:hover{border-color:var(--brick);}

.panel{display:none;}
.panel.active{display:block;}

/* MAP */
.map-frame{
  position:relative;
  border:2px solid var(--ink);
  background: var(--parchment-dk);
  border-radius:4px;
  overflow:hidden;
}
.map-frame svg{display:block; width:100%; height:auto;}
.country{
  fill:var(--land);
  stroke:var(--ink);
  stroke-width:1.4;
  stroke-linejoin:round;
  cursor:pointer;
  transition:fill .15s;
}
.country:hover{fill:var(--land-hover);}
.country.sel{fill:var(--land-sel); stroke:var(--brick); stroke-width:2.2;}
.country-label{
  font-family:'IBM Plex Mono', monospace; font-size:13px; fill:var(--ink);
  text-anchor:middle; pointer-events:none; letter-spacing:.02em;
  paint-order: stroke;
  stroke: var(--parchment-dk);
  stroke-width: 3px;
}
.info-card{
  margin-top:16px; border:1.5px solid var(--ink); border-radius:4px; padding:16px 20px;
  background:var(--parchment-dk); min-height:120px;
}
.info-card h3{margin:0 0 8px; color:var(--brick); font-size:1.4rem;}
.info-card .row{margin:4px 0; font-size:.95rem;}
.info-card .row b{font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); display:inline-block; min-width:110px;}
.hint{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#6b7562; text-align:center; margin-top:10px;}

/* QUIZ */
.quiz-box{border:1.5px solid var(--ink); border-radius:4px; background:var(--parchment-dk); padding:26px; text-align:center;}
.quiz-score{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--teal); margin-bottom:14px;}
.quiz-q{font-family:'Playfair Display', serif; font-size:1.3rem; margin:0 0 22px; line-height:1.4;}
.quiz-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:640px; margin:0 auto;}
@media(max-width:640px){.quiz-opts{grid-template-columns:1fr;}}
.opt-btn{
  font-family:'EB Garamond', serif; font-size:1rem; padding:12px 14px; border-radius:3px;
  border:1.5px solid var(--ink); background:var(--parchment); cursor:pointer; text-align:left;
}
.opt-btn:hover{border-color:var(--brick);}
.opt-btn.correct{background:#d7e6c9; border-color:#4a7c2f;}
.opt-btn.wrong{background:#eecfc2; border-color:var(--brick);}
.opt-btn:disabled{cursor:default;}
.quiz-next{
  margin-top:20px; font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:.06em;
  background:var(--teal); color:var(--parchment); border:none; padding:10px 22px; border-radius:2px; cursor:pointer;
  display:none;
}
.quiz-next.show{display:inline-block;}
.quiz-feedback{font-family:'IBM Plex Mono', monospace; font-size:12px; height:18px; margin-top:12px; color:var(--brick);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="compass"></div>
    <div class="eyebrow">Bacalaureat · Geografia Europei</div>
    <h1>Atlas de buzunar</h1>
    <p>13 state, un continent — click pe hartă sau testează-te la joc</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="map">Harta</button>
    <button class="tab-btn" data-tab="quiz">Joc de antrenament</button>
  </div>

  <div id="panel-map" class="panel active">
    <div class="map-frame">
      <svg id="mapSvg" viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
        <g id="countries"></g>
      </svg>
    </div>
    <div class="info-card" id="infoCard">
      <p style="color:#6b7562; font-family:'IBM Plex Mono',monospace; font-size:12.5px;">Selectează o țară de pe hartă pentru a vedea fișa ei.</p>
    </div>
    <div class="hint">contur geografic real, simplificat · proiecţie Mercator</div>
  </div>

  <div id="panel-quiz" class="panel">
    <div class="quiz-box">
      <div class="quiz-score" id="quizScore">Scor: 0 / 0</div>
      <div class="quiz-q" id="quizQ">Se încarcă...</div>
      <div class="quiz-opts" id="quizOpts"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <button class="quiz-next" id="quizNext">Următoarea →</button>
    </div>
  </div>
</div>

const NAMES = Object.keys(DATA);

/* ---------- MAP ---------- */
const svgGroup = document.getElementById('countries');
const infoCard = document.getElementById('infoCard');
const svgNS = "http://www.w3.org/2000/svg";

NAMES.forEach(name=>{
  const d = DATA[name];
  const p = document.createElementNS(svgNS,'path');
  p.setAttribute('d', d.d);
  p.setAttribute('class','country');
  p.dataset.name = name;
  p.addEventListener('click', ()=>{
    document.querySelectorAll('.country').forEach(el=>el.classList.remove('sel'));
    p.classList.add('sel');
    showInfo(name);
  });
  svgGroup.appendChild(p);
});
NAMES.forEach(name=>{
  const d = DATA[name];
  const label = document.createElementNS(svgNS,'text');
  label.setAttribute('x', d.c[0]);
  label.setAttribute('y', d.c[1]);
  label.setAttribute('class','country-label');
  label.textContent = name;
  label.style.pointerEvents='none';
  svgGroup.appendChild(label);
});

function showInfo(name){
  const d = DATA[name];
  infoCard.innerHTML = `
    <h3>${name}</h3>
    <div class="row"><b>Relief</b>${d.relief}</div>
    <div class="row"><b>Climă</b>${d.clima}</div>
    <div class="row"><b>Ape</b>${d.ape}</div>
    <div class="row"><b>Vegetaţie</b>${d.vegetatie}</div>
    <div class="row"><b>Oraşe</b>${d.orase}</div>
    <div class="row"><b>Notă</b>${d.extra}</div>
  `;
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------- QUIZ ---------- */
const FIELDS = [
  {key:'relief', label:d=>`Ce relief găsim în ${d}?`},
  {key:'clima', label:d=>`Ce tip de climă are ${d}?`},
  {key:'ape', label:d=>`Ce ape principale străbat ${d}?`},
  {key:'vegetatie', label:d=>`Ce tip de vegetaţie domină în ${d}?`},
  {key:'orase', label:d=>`Care sunt oraşele importante din ${d}?`}
];

let score=0, total=0, current=null;
const quizQ=document.getElementById('quizQ'), quizOpts=document.getElementById('quizOpts'),
      quizScore=document.getElementById('quizScore'), quizNext=document.getElementById('quizNext'),
      quizFeedback=document.getElementById('quizFeedback');

function pickQuestion(){
  const country = NAMES[Math.floor(Math.random()*NAMES.length)];
  const field = FIELDS[Math.floor(Math.random()*FIELDS.length)];
  const correct = DATA[country][field.key];
  let pool = NAMES.filter(n=>n!==country).map(n=>DATA[n][field.key]).filter(v=>v!==correct);
  pool = shuffle(pool).slice(0,3);
  const options = shuffle([correct, ...pool]);
  current = {question: field.label(country), correct, options};
  render();
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function render(){
  quizQ.textContent = current.question;
  quizOpts.innerHTML='';
  quizFeedback.textContent='';
  quizNext.classList.remove('show');
  current.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.textContent=opt;
    b.addEventListener('click', ()=> answer(opt,b));
    quizOpts.appendChild(b);
  });
}
function answer(opt, btn){
  total++;
  const buttons=[...quizOpts.children];
  buttons.forEach(b=>b.disabled=true);
  if(opt===current.correct){
    score++;
    btn.classList.add('correct');
    quizFeedback.textContent='Corect!';
  } else {
    btn.classList.add('wrong');
    buttons.find(b=>b.textContent===current.correct).classList.add('correct');
    quizFeedback.textContent='Răspuns corect evidenţiat mai sus.';
  }
  quizScore.textContent = `Scor: ${score} / ${total}`;
  quizNext.classList.add('show');
}
quizNext.addEventListener('click', pickQuestion);
pickQuestion();
</script>
